// Moochy Relay operator admin plane. Owner: mo-relay.
//
// Transport: gRPC over a Unix domain socket (`relay serve --admin-socket <path>`), mode 0600,
// peer uid checked against the relay's own uid (Linux SO_PEERCRED). Plaintext h2c is allowed
// ONLY here (CONTRACT §12). Never exposed on the network. CLI: `relay admin <state|suspend|drain|catalog-publish>`.
syntax = "proto3";

package moochy.v1;

option go_package = "moochy.dev/relay/internal/pb;pb";

service RelayAdmin {
  // Ledger and liveness snapshot (same document as the dev API's GET /dev/state, plus the audit).
  rpc State(AdminStateRequest) returns (AdminStateResponse);
  // Suspend a user (all their devices are disconnected and refused) or revoke one device.
  rpc Suspend(AdminSuspendRequest) returns (AdminSuspendResponse);
  // Drain (plan 10 §3): stop assigning, fail unstarted tasks retryably, give started streams
  // up to `grace_ms` to finish, flush the writer, then exit so a new binary can start.
  rpc Drain(AdminDrainRequest) returns (AdminDrainResponse);
  // Publish a new catalog version (exact JSON bytes, CONTRACT §6 / plan 05 §2.2). Versions are
  // monotonic; an existing version can never be replaced.
  rpc CatalogPublish(AdminCatalogPublishRequest) returns (AdminCatalogPublishResponse);
}

message AdminStateRequest {}

message AdminStateResponse {
  bytes state_json = 1;            // pledges, members, devices, attempts, receipts, alerts
  bool audit_ok = 2;               // nightly-audit invariants L4/L5 hold right now
  repeated string audit_mismatches = 3;
}

message AdminSuspendRequest {
  oneof target {
    string username = 1;           // suspends the user (status = suspended)
    string device_id = 2;          // revokes the device (revoked_at = now)
  }
  string reason = 3;
}

message AdminSuspendResponse {
  uint32 devices_disconnected = 1;
}

message AdminDrainRequest {
  uint32 grace_ms = 1;             // default and maximum 30000
}

message AdminDrainResponse {
  uint32 failed_unstarted = 1;
  uint32 finished_started = 2;
}

message AdminCatalogPublishRequest {
  bytes catalog_json = 1;
}

message AdminCatalogPublishResponse {
  uint64 version = 1;
}
