// Moochy Node <-> Relay link. Normative. Owner: integrator (changes go through spec review).
//
// Transport: gRPC over HTTP/2, TLS 1.3 only, ALPN "h2". No gRPC compression (ciphertext does not
// compress, and compression next to secrets invites CRIME-style oracles).
//
// Authentication is PER HTTP/2 CONNECTION, like a WebSocket session:
//   1. The Node opens Session(); the Relay sends Hello{nonce} first.
//   2. The Node answers Auth{device_id, roles, sig} where
//      sig = Ed25519(device_key, lp("moochy/v1/auth", nonce, dialed_origin, tls_exporter, device_id))
//      and tls_exporter is the RFC 9266 channel-binding value of THIS TLS connection.
//   3. The Relay replies Welcome{session_id}. Submit/Serve streams are then accepted only when they
//      arrive on the SAME underlying connection (the Relay's TransportCredentials tag every
//      connection with an id; streams from any other connection get UNAUTHENTICATED), and they must
//      carry metadata "x-moochy-session: <session_id>".
// A Node that loses its connection rebuilds the channel and authenticates again.
//
// Payload security is unchanged by the transport: request bodies and responses travel as AEAD
// ciphertext in `bytes` fields; route headers, receipts and projections are the exact signed JSON
// bytes (see spec/CONTRACT.md §1, §3). IDs are strings as in CONTRACT §1. Money is int64 micro-USD.
syntax = "proto3";

package moochy.v1;

option go_package = "moochy.dev/relay/internal/pb;pb";

service NodeLink {
  // Long-lived control stream. Exactly one per connection. First server message: Hello.
  rpc Session(stream NodeMsg) returns (stream RelayMsg);
  // Gateway role: one stream per task. First client message: SubmitOpen.
  rpc Submit(stream SubmitUp) returns (stream SubmitDown);
  // Worker role: one stream per assigned attempt, opened after an AssignNotice on Session.
  // First client message: ServeOpen. First server message: Assign.
  rpc Serve(stream ServeUp) returns (stream ServeDown);
  // Device login (unauthenticated, strictly rate-limited per IP).
  rpc DeviceStart(DeviceStartRequest) returns (DeviceStartResponse);
  rpc DevicePoll(DevicePollRequest) returns (DevicePollResponse);
  // Public key-log tiles and checkpoint (C2SP tlog-tiles paths, e.g. "tile/0/000", "checkpoint").
  // Unauthenticated, strictly rate-limited per IP, response capped at 123,392 bytes (one full data tile, spec/KEYLOG.md). Lets Nodes mirror and
  // verify the key log over the link they already have.
  rpc GetLogTile(LogTileRequest) returns (LogTileResponse);

  // Donations (the donor's own; integrator 2026-10-02, shape from mo-relay). Authenticated like
  // Submit (same connection as the Session + x-moochy-session metadata); the user is always the
  // session's user, never a field. Errors: NOT_FOUND, ALREADY_EXISTS (a live donation to that repo),
  // INVALID_ARGUMENT, FAILED_PRECONDITION (ended/declined), RESOURCE_EXHAUSTED. A new donation is
  // "pending" until the repo owner signs DONOR_APPROVED. Internal ids keep the name "pledge".
  rpc ListDonations(ListDonationsRequest) returns (ListDonationsResponse);
  rpc Donate(DonateRequest) returns (Donation);
  rpc DonationAction(DonationActionRequest) returns (Donation);
  // Owner sets a member device's monthly cap for one repo (`moochy members add --device --cap`).
  rpc SetDeviceCap(SetDeviceCapRequest) returns (SetDeviceCapResponse);
  // Cloud boxes (CONTRACT §17.1), authenticated like SetDeviceCap. The repo owner, or a member
  // within their own cap, creates an enrollment token; a box enrolls with it (DeviceStartRequest
  // .enroll_token) as an ephemeral gateway device. Box devices themselves get PERMISSION_DENIED.
  rpc CreateBoxToken(CreateBoxTokenRequest) returns (BoxToken);
  // Tokens and box devices of the repos this user may manage (owner: every box; member: their own).
  rpc ListBoxes(ListBoxesRequest) returns (ListBoxesResponse);
  // `bt_…`: the token can enroll no more boxes and every box it enrolled is revoked; `d_…`: one box.
  rpc RevokeBox(RevokeBoxRequest) returns (RevokeBoxResponse);

  // A218 (integrator 2026-10-02): the owner CLI checks what it is about to sign against the relay
  // itself, not through the background Node's labels. Same rules as the web's /api/lookup.
  // Unauthenticated, strictly rate-limited per IP. Repo only (handle empty): the claimed repo's
  // canonical slug and id (public). With a handle: answered only when `sig` is an active Ed25519
  // owner key of `owner` (never a passkey) over lp("moochy/v1/lookup", handle, repo_slug, owner,
  // decimal(issued_at_ms)), issued within 5 minutes, for a person with a donation or membership on
  // that repo, which `owner` must hold. Every refusal is NOT_FOUND, alike (no oracle).
  rpc Lookup(LookupRequest) returns (LookupResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_GATEWAY = 1;
  ROLE_WORKER = 2;
}

// ---------------------------------------------------------------- Session

message NodeMsg {
  oneof msg {
    Auth auth = 1;
    WorkerOffer offer = 2;
    KnownTasks known_tasks = 3;
    ReceiptDispute dispute = 4;
    ReplayReceipt replay_receipt = 5;
    Ping ping = 6;
    SignedLogEntry log_entry = 7;      // owner-signed claim / approval / membership (key log)
  }
}

message RelayMsg {
  oneof msg {
    Hello hello = 1;
    Welcome welcome = 2;
    PoolSync pool_sync = 3;
    AssignNotice assign = 4;
    LogCheckpoint log_checkpoint = 5;
    CatalogUpdate catalog = 6;
    Draining draining = 7;
    ReceiptReplaySince replay_since = 8;
    ReceiptAck receipt_ack = 9;
    Pong pong = 10;
    Error error = 11;
    LogEntryAck log_entry_ack = 12;
    ApprovalRequests approval_requests = 13;  // pushed to repo owners' Nodes
  }
}

message Hello {
  bytes nonce = 1;                 // 32 random bytes
  int64 server_time_ms = 2;
  string min_client_version = 3;
  string relay_release = 4;
  bytes log_checkpoint = 5;        // signed-note bytes of the latest key-log checkpoint (may be empty)
}

message Auth {
  string device_id = 1;
  repeated Role roles = 2;
  bytes sig = 3;                   // see header comment
  string client_version = 4;
  // §17.1 clone detection (integrator decision): 16 random bytes generated at every process start.
  // Two live sessions of one device key with different instance values inside the session lease
  // are a clone: the relay refuses the newer one and alerts the owner (BoxCloneRefused).
  bytes instance = 5;
}

message Welcome {
  string session_id = 1;
  repeated Role roles = 2;
  uint32 max_concurrent_tasks = 3;
  uint64 catalog_version = 4;
}

message PoolSync {
  string repo_id = 1;
  bool full = 2;                   // true: replace the pool; false: upsert workers + remove listed ones
  repeated PoolWorker workers = 3;
  repeated string removed_worker_devices = 4;
  string repo_slug = 5;            // "owner/name" (lowercase), for repo-scoped local tokens
  string repo_provider = 6;        // "github" | "gitlab"
  bool auto_cache = 7;             // repo setting: Gateway adds top-level automatic caching to multi-turn Anthropic requests (plan 07 §4.2)
  repeated string excluded_providers = 8;  // repo setting (§15.4): the Gateway never seals to a worker serving through these providers
  bool allow_unsandboxed_tools = 9;        // repo setting (§15.4): release pooled tool calls to clients outside `moochy run` (default false)
  repeated string pinned_donors = 10;      // repo setting: donor pseudonyms the project prefers; the Gateway tries them first (empty = no preference)
  bool allow_platform_sandboxes = 11;      // repo setting (§17.2) resolved for THIS device: release pooled tool calls to `moochy run --box-is-sandbox` sessions (default true for box devices, false otherwise)
}

message PoolWorker {
  string worker_device = 1;
  bytes enc_pub = 2;               // X25519 public key (32 bytes)
  uint64 key_log_index = 3;
  uint64 approval_log_index = 4;
  string donor_pseudonym = 5;
  repeated string dialects = 6;    // "anthropic.messages" | "openai.chat" | "openai.responses" (CONTRACT §18.2: openai, xai, openrouter only)
  repeated string models = 7;      // public model ids (slugs)
  uint32 hint = 8;                 // 0-100, coarse
  bytes sign_pub = 9;              // Ed25519 key of the worker device (verifies receipts, progress checkpoints)
  repeated ServedModel served = 10; // which provider serves each model on this worker (project provider exclusion, §15.4)
}

message ServedModel {
  string model = 1;                // public model id
  string provider = 2;             // anthropic | openai | openrouter | deepseek | xai | local
}

message WorkerOffer {
  uint32 slots_free = 1;
  repeated ModelOffer models = 2;
  repeated string pledges = 3;
  bool window_open = 4;
  int64 local_cap_left_uusd = 5;
}

message ModelOffer {
  string dialect = 1;
  string model = 2;
  uint32 rl_headroom = 3;          // 0-100
  string provider = 4;             // the donor's provider serving this model (anthropic | openai | openrouter | deepseek | xai | local)
}

message KnownTasks {
  repeated KnownTask tasks = 1;
}

message KnownTask {
  string task = 1;
  uint32 attempt = 2;
  string state = 3;                // "running" | "outbox"
}

message AssignNotice {
  string task = 1;
  uint32 attempt = 2;
}

message ReceiptDispute {
  string task = 1;
  uint32 attempt = 2;
  string code = 3;
  bytes gateway_sig = 4;           // Ed25519 over lp("moochy/v1/dispute", task, u64(attempt), code)
}

message ReplayReceipt {
  SignedReceipt receipt = 1;
}

message ReceiptReplaySince {
  int64 since_ms = 1;
}

message ReceiptAck {
  string task = 1;
  uint32 attempt = 2;
  // Receipt transparency log (spec/KEYLOG.md §8): where the settled receipt was logged, an RFC 9162
  // inclusion proof, and the signed receipt-log checkpoint the proof is against. Empty until logged.
  uint64 receipt_log_index = 3;
  repeated bytes receipt_log_proof = 4;  // 32-byte hashes, leaf to root
  bytes receipt_log_checkpoint = 5;      // signed-note bytes (origin moochy.dev/receipts)
}

message LogCheckpoint {
  bytes note = 1;                  // signed-note bytes
}

message CatalogUpdate {
  uint64 version = 1;
  bytes catalog_json = 2;          // exact signed bytes
  bytes sig = 3;
}

message Draining {
  uint32 reconnect_after_ms = 1;
}

message Ping {
  int64 t_ms = 1;
}

message Pong {
  int64 t_ms = 1;
}

message Error {
  string code = 1;
  string message = 2;
  string task = 3;
}

// Owner-signed key-log entries (formats defined by the key-log spec, kind = KEY_* / REPO_CLAIMED /
// DONOR_APPROVED / DONOR_REVOKED / MEMBER_ADDED / MEMBER_REMOVED). `body` is the exact signed bytes.
message SignedLogEntry {
  string request_id = 1;           // client-chosen id, echoed in LogEntryAck
  string kind = 2;
  bytes body = 3;
  repeated bytes sigs = 4;
}

message LogEntryAck {
  string request_id = 1;
  uint64 index = 2;                // position in the key log once appended
  string error = 3;                // empty on success
}

// Requests waiting for a repo owner's signature (donor approvals, member additions, repo claims).
// The owner's Node MUST parse `body_to_sign`, show its meaning to the owner, and sign only on an
// explicit `moochy approve` / `moochy members add` / `moochy claim`; it never signs what the relay
// proposes automatically.
message ApprovalRequests {
  repeated ApprovalRequest requests = 1;
}

message ApprovalRequest {
  string request_id = 1;
  string kind = 2;
  string repo_id = 3;
  string repo_slug = 4;
  string subject_username = 5;
  string subject_pseudonym = 6;
  string pledge_id = 7;
  int64 created_at_ms = 8;
  bytes body_to_sign = 9;
  string summary = 10;             // human-readable, for display only (never signed as-is)
}

message LogTileRequest {
  string path = 1;
}

message LogTileResponse {
  bytes data = 1;
}

// ------------------------------------------------------- Shared payloads

// AEAD ciphertext chunk. For request bodies attempt = 0. Plaintext <= 65,497 bytes.
// AAD binds task id, attempt, seq and last (CONTRACT §3); the stream itself identifies the task.
message Chunk {
  uint32 attempt = 1;
  uint32 seq = 2;
  bool last = 3;
  bytes ct = 4;
}

message Wrap {
  string worker_device = 1;
  bytes wrap = 2;                  // 80 bytes: HPKE enc (32) || ct (48)
}

message Checkpoint {
  uint32 attempt = 1;
  uint32 seq = 2;
  bytes running_hash = 3;
  bytes sig = 4;
}

message SignedReceipt {
  string task = 1;
  uint32 attempt = 2;
  bytes receipt = 3;               // exact signed JSON bytes
  bytes donor_sig = 4;
  bytes projection = 5;            // exact signed JSON bytes
  bytes projection_sig = 6;
}

message Cancel {
  string reason = 1;
}

message Failed {
  string code = 1;                 // CONTRACT / plan 03 §10.2-10.3 codes
  bool retryable = 2;
  uint32 retry_after_ms = 3;
  bytes sealed_detail = 4;         // detail sealed to the Gateway (Relay sees only `code`)
  uint32 attempt = 5;              // attempt whose Worker produced sealed_detail (0 = relay-side failure)
  string worker_device = 6;        // needed with `r` to derive K_det (CONTRACT §3)
  bytes r = 7;                     // the attempt's response salt
}

// --------------------------------------------------------------- Submit

message SubmitUp {
  oneof msg {
    SubmitOpen open = 1;
    Chunk body = 2;
    Wraps wraps = 3;               // answer to NeedWraps
    Cancel cancel = 4;
  }
}

message SubmitOpen {
  string task = 1;
  bytes route = 2;                 // exact route-header JSON bytes (bound as HPKE AAD)
  repeated Wrap wraps = 3;         // <= 8
  uint64 body_len = 4;
  uint32 body_chunks = 5;
  bool platform_sandboxed = 6;     // §17.2: the request comes from a `moochy run --box-is-sandbox` session (the box, not moochy, is the sandbox)
}

message Wraps {
  repeated Wrap wraps = 1;
}

message SubmitDown {
  oneof msg {
    NeedWraps need_wraps = 1;
    Accepted accepted = 2;
    Started started = 3;
    Chunk chunk = 4;
    Checkpoint checkpoint = 5;
    SignedReceipt end = 6;
    Failed failed = 7;
  }
}

message NeedWraps {
  repeated string workers = 1;
}

message Accepted {
  uint32 attempt = 1;
  string worker_device = 2;
  bytes r = 3;                     // the Worker's per-attempt response salt
}

message Started {
  uint32 attempt = 1;
}

// ---------------------------------------------------------------- Serve

message ServeUp {
  oneof msg {
    ServeOpen open = 1;
    Ack ack = 2;
    Nack nack = 3;
    Started started = 4;
    Chunk chunk = 5;
    Checkpoint checkpoint = 6;
    SignedReceipt end = 7;
  }
}

message ServeOpen {
  string task = 1;
  uint32 attempt = 2;
}

message Ack {
  bytes r = 1;
}

message Nack {
  bytes r = 1;
  string code = 2;
  bool retryable = 3;
  uint32 retry_after_ms = 4;
  bytes sealed_detail = 5;
}

message ServeDown {
  oneof msg {
    Assign assign = 1;
    Chunk body = 2;
    Cancel cancel = 3;
    ReceiptAck receipt_ack = 4;
  }
}

message Assign {
  string task = 1;
  uint32 attempt = 2;
  bytes route = 3;                 // exact route-header JSON bytes
  bytes wrap = 4;                  // this worker's wrap
  string pledge_id = 5;
  string repo_id = 6;
  uint32 deadline_ack_ms = 7;
  uint64 body_len = 8;
  uint32 body_chunks = 9;
  bytes pledge_policy = 10;        // exact pledge policy JSON (models, max_effort, dialects, flags, max_slots, schedule) for local enforcement
  int64 pledge_headroom_uusd = 11; // budget - spent - reserved at assignment (advisory; the Worker's local caps still rule)
  int64 per_task_cap_uusd = 12;
  uint64 catalog_version = 13;     // catalog version in effect at attempt start
  string gateway_device = 14;      // the requesting Gateway device (verified by the Worker against the key log); lets the donor give each member its own provider pseudonym
}

// ---------------------------------------------------------- Device login

message DeviceStartRequest {
  bytes sign_pub = 1;              // Ed25519 public key
  bytes enc_pub = 2;               // X25519 public key
  repeated Role roles = 3;
  string name = 4;
  string suite = 5;                // envelope suite id
  bytes sig = 6;                   // Ed25519(sign key, lp("moochy/v1/device-start", sign_pub, enc_pub, roles_csv, name, suite))
  bytes pop_sig = 7;               // key-log proof of possession (label moochy/v1/key-pop, spec/KEYLOG.md); goes into KEY_ADDED
  // §17.1 box enrollment: a token from CreateBoxToken. The relay checks it (hash, not expired or
  // revoked, fewer than max_boxes uses), requires roles == [GATEWAY], logs KEY_ADDED with the box
  // flag, the expiry and repo_scope, and approves without a browser: user_code is empty and the
  // first DevicePoll answers APPROVED. A bad token: PERMISSION_DENIED (no detail on which check).
  string enroll_token = 8;
}

message DeviceStartResponse {
  string user_code = 1;            // "XXXX-XXXX", shown to the user
  string device_code = 2;          // secret, used only for polling
  uint32 poll_interval_ms = 3;
  int64 expires_at_ms = 4;
}

message DevicePollRequest {
  string device_code = 1;
}

enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_PENDING = 1;
  DEVICE_STATE_APPROVED = 2;
  DEVICE_STATE_DENIED = 3;
  DEVICE_STATE_EXPIRED = 4;
}

message DevicePollResponse {
  DeviceState state = 1;
  string device_id = 2;
  string user_pseudonym = 3;
  string username = 4;
  // Enrolled boxes only (§17.1): the ephemeral device's scope, expiry and own cap.
  bool box = 5;
  string repo_slug = 6;
  int64 expires_at_ms = 7;
  int64 cap_uusd_month = 8;
}

message ListDonationsRequest {}

message ListDonationsResponse {
  repeated Donation donations = 1;
}

message DonateRequest {
  string request_id = 1;           // idempotency key (ULID)
  string repo_slug = 2;            // "owner/name"
  int64 budget_uusd = 3;           // monthly limit
  int64 per_task_cap_uusd = 4;     // limit per request
  repeated string models = 5;      // public model ids; empty = any in the catalog
  string max_effort = 6;
  string visibility = 7;           // public | pseudonymous | anonymous
  string schedule = 8;             // always | nights | weekends | nights_weekends
}

message DonationActionRequest {
  string pledge_id = 1;
  string action = 2;               // pause | resume | reclaim | update
  int64 amount_uusd = 3;           // reclaim: > 0 lowers the monthly limit, 0 ends the donation
  DonateRequest update = 4;        // action = update
}

message Donation {
  string pledge_id = 1;
  string repo_slug = 2;
  string status = 3;               // pending | active | paused | ended | declined | frozen
  int64 budget_uusd = 4;
  int64 per_task_cap_uusd = 5;
  int64 spent_uusd = 6;
  int64 reserved_uusd = 7;
  int64 period_start_ms = 8;
  repeated string models = 9;
  string max_effort = 10;
  string visibility = 11;
  string schedule = 12;
  int64 created_at_ms = 13;
}

message SetDeviceCapRequest {
  string repo_slug = 1;
  string device = 2;               // device id or name of a member's device
  int64 cap_uusd_month = 3;        // 0 removes the device cap (the member cap still applies)
}

message SetDeviceCapResponse {
  string device_id = 1;
  int64 cap_uusd_month = 2;
}

// ---------------------------------------------------------- Cloud boxes (§17.1)

message CreateBoxTokenRequest {
  string request_id = 1;           // idempotency key (ULID)
  string repo_slug = 2;            // "owner/name"
  int64 ttl_ms = 3;                // 10 min .. 30 days; the token AND every box it enrolls expire at created + ttl
  int64 cap_uusd_month = 4;        // each box's own monthly cap (> 0; a member's boxes also count against the member's cap)
  uint32 max_boxes = 5;            // enrollments this token allows, 1..100
}

message BoxToken {
  string token_id = 1;             // "bt_" + ULID
  string token = 2;                // the secret ("mbx_" + 43 base64url chars): CreateBoxToken only, never stored in clear
  string repo_slug = 3;
  int64 created_at_ms = 4;
  int64 expires_at_ms = 5;
  int64 cap_uusd_month = 6;
  uint32 max_boxes = 7;
  uint32 used = 8;                 // enrollments so far
  bool revoked = 9;
  string created_by = 10;          // username of the owner or member who created it
}

message BoxDevice {
  string device_id = 1;
  string name = 2;
  string token_id = 3;
  string repo_slug = 4;
  int64 enrolled_at_ms = 5;
  int64 expires_at_ms = 6;
  int64 cap_uusd_month = 7;
  int64 spent_uusd_month = 8;
  bool online = 9;
  bool revoked = 10;
  uint32 clone_refusals = 11;      // second concurrent sessions refused for this device key (§17.1)
}

message ListBoxesRequest {
  string repo_slug = 1;            // "" = every repo this user may manage
}

message ListBoxesResponse {
  repeated BoxToken tokens = 1;    // token field always empty
  repeated BoxDevice boxes = 2;
}

message RevokeBoxRequest {
  string id = 1;                   // "bt_…" or "d_…"
}

message RevokeBoxResponse {
  repeated string revoked_devices = 1;
  bool token_revoked = 2;
}

// ---------------------------------------------------------- Lookup (A218)

message LookupRequest {
  string repo_slug = 1;            // "owner/name" (GitHub) or "github/…" / "gitlab/…/name"
  string handle = 2;               // "" = repo lookup only
  string owner = 3;                // the owner's pseudonym (handle lookups)
  string owner_key_id = 4;         // an active Ed25519 owner key of `owner` (KEYLOG §4)
  int64 issued_at_ms = 5;
  bytes sig = 6;                   // 64 bytes
}

message LookupResponse {
  string repo_slug = 1;            // canonical
  string repo_id = 2;
  string handle = 3;               // canonical; handle lookups only
  string pseudonym = 4;            // handle lookups only
}
