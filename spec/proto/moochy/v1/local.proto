// Moochy Node local control plane. Owner: mo-node.
//
// Transport: gRPC over HTTP/2 cleartext on the Unix socket <home>/state/node.sock only
// (directory 0700, socket 0600, peer uid must equal the Node's uid). Never on TCP.
// Clients: the `moochy` CLI (status, pause, resume, env, down, journal, approve, members) and the
// stdio MCP shim (`moochy mcp`, via McpPipe). The socket is the authentication: no tokens here.
//
// Every string a client prints from these messages may originate from the Relay or a donor:
// clients strip/escape control characters before printing (CONTRACT §11).
syntax = "proto3";

package moochy.v1;

service LocalControl {
  // Node state at a glance. Must answer in well under 20 ms (CONTRACT §13).
  rpc Status(StatusRequest) returns (StatusResponse);
  // Local kill switch for the Worker role: instant, works offline, not persisted across restarts.
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(PauseRequest) returns (PauseResponse);
  // Base URLs + repo-scoped local token for tools (`moochy env`). `rotate` invalidates every token.
  rpc Env(EnvRequest) returns (EnvResponse);
  // Repo owner: sign a pending donor approval / membership change / repo claim with this device
  // (plan 06 §5). The Node only signs a request the Relay pushed (ApprovalRequests), after
  // checking its exact body; `dry_run` returns what would be signed without signing.
  rpc Approve(ApproveRequest) returns (SignResponse);
  rpc Members(MembersRequest) returns (SignResponse);
  rpc Claim(ClaimRequest) returns (SignResponse);
  // CONTRACT §19.3: ORG_REPO_ADDED / ORG_REPO_REMOVED previews (dry run only, like Claim).
  rpc OrgRepo(OrgRepoRequest) returns (SignResponse);
  // Requests waiting for this owner's signature.
  rpc Pending(PendingRequest) returns (PendingResponse);
  // Owner key (CONTRACT §15.4, KEYLOG §4): the foreground CLI signed this key-log entry with the
  // owner key after the user confirmed it; the Node never holds the owner key, it only relays the
  // signed entry over its session and returns the relay's verdict. Approve/Members/Claim are then
  // called with dry_run = true (preview only).
  rpc SubmitEntry(SubmitEntryRequest) returns (SignResponse);
  // Donations (`moochy donate`, `moochy donations`): relayed as-is to NodeLink ListDonations /
  // Donate / DonationAction on the node's authenticated session (the relay knows the user from
  // the session, never from a field). `request`/`response` are the link.proto messages' bytes.
  rpc Donations(DonationsRequest) returns (DonationsResponse);
  // `moochy verify <receipt_ref>` (E63): fetch the public projection over the link and check the
  // donor's signature against the device key in this node's verified key-log mirror.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // `moochy owner trust <ok_id>` (CONTRACT §16.6): mark an owner key of this account that was
  // created elsewhere (a passkey registered on the web) as known, so the monitor stops alerting.
  rpc TrustOwnerKey(TrustOwnerKeyRequest) returns (TrustOwnerKeyResponse);
  // Local audit journal (metadata only). `follow` keeps the stream open for new entries.
  rpc Journal(JournalRequest) returns (stream JournalEntry);
  // stdio MCP shim: first message McpOpen, then raw newline-delimited JSON-RPC bytes both ways.
  rpc McpPipe(stream McpUp) returns (stream McpDown);
  // Graceful stop (`moochy down`).
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // `moochy logout`: ask the relay to revoke this device (KEY_REVOKED), then stop.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // `moochy report <task>`: evidence bundle for a task this Gateway consumed (06 §9): receipt,
  // checkpoints, response bytes and only S_resp (never the request).
  rpc Report(ReportRequest) returns (ReportResponse);
  // Owner and member calls relayed as-is on the node's session (like Donations): `op` names the
  // NodeLink RPC; `request`/`response` are its link.proto messages' bytes. Ops: set_device_cap,
  // create_box_token, list_boxes, revoke_box.
  rpc LinkCall(LinkCallRequest) returns (LinkCallResponse);
  // CONTRACT §20 (`moochy tui`): live dashboard events until the client hangs up. Bounded and
  // rate-limited per watcher: at most 20 events per second plus one `snapshot` per 250 ms; what
  // does not fit (burst, slow reader, lagged journal) is coalesced into one `snapshot` event, the
  // signal to re-read Status / Pending / Donations / Journal. Metadata only, never content.
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message StatusRequest {}

message StatusResponse {
  string version = 1;
  string device_id = 2;
  repeated string roles = 3;
  string relay = 4;
  string link_state = 5;           // "down" | "up" | "refused: <code>" | "offline"
  string gateway_url = 6;
  string mcp_url = 7;
  bool paused = 8;
  uint32 slots_max = 9;
  uint32 slots_busy = 10;
  uint32 gateway_tasks = 11;       // in flight
  repeated PoolSummary pools = 12;
  uint32 pid = 13;
  int64 clock_skew_ms = 14;        // relay server_time − node clock at the last Hello (0 = unknown)
  uint32 provider_keys = 15;
  uint32 warm_adapters = 16;
  uint64 catalog_version = 17;
  // CONTRACT §20: provider keys present on this device (names only: never values or URLs).
  repeated ProviderKeyInfo keys = 18;
  bool locked = 19;                // the background process locked itself down (§15.2)
  // Recent key-log monitor alerts, oldest first (≤ 16), each `{"message","fields"}` JSON as
  // logged; relay/peer-derived strings inside: clean before printing.
  repeated string alerts = 20;
}

message ProviderKeyInfo {
  string provider = 1;             // anthropic | openrouter | deepseek | openai | xai | local
  repeated string models = 2;      // `local`: the public slugs it serves (`local/<slug>`)
}

message PoolSummary {
  string repo_id = 1;
  string slug = 2;
  uint32 workers = 3;
  repeated string models = 4;
}

message PauseRequest {}

message PauseResponse {
  bool paused = 1;
}

message EnvRequest {
  string repo = 1;                 // owner/name
  bool rotate = 2;
}

message EnvResponse {
  string anthropic_base_url = 1;
  string openai_base_url = 2;
  string mcp_url = 3;
  string token = 4;
}

message ApproveRequest {
  string repo = 1;                 // owner/name
  string donor = 2;                // donor username (CONTRACT §11 handle) or pseudonym
  bool dry_run = 3;
  bool revoke = 4;                 // DONOR_REVOKED instead of DONOR_APPROVED
  string org = 5;                  // CONTRACT §19.4: "github/acme", "gitlab/group[/sub…]"; set = the org's approval (repo empty)
  string person = 6;               // CONTRACT §24.4: "github/{login}", "gitlab/{username}"; set = the person's approval (repo, org empty)
}

message ClaimRequest {
  string repo = 1;
  bool dry_run = 2;
  string org = 3;                  // CONTRACT §19.2: set = ORG_CLAIMED of this org (repo empty)
  string person = 4;               // CONTRACT §24: set = PERSON_CLAIMED of this person (repo, org empty)
}

// CONTRACT §19.3: which of the owner's projects an organisation's donations fund.
message OrgRepoRequest {
  string org = 1;                  // "github/acme", "gitlab/group[/sub…]"
  string repo = 2;                 // a project in the link's canonical form
  bool remove = 3;                 // ORG_REPO_REMOVED instead of ORG_REPO_ADDED
  bool dry_run = 4;
  string person = 5;               // CONTRACT §24.3: set (and org empty) = PERSON_REPO_ADDED / PERSON_REPO_REMOVED
}

// What the owner signs (or would sign), decoded from the exact body bytes.
message SignResponse {
  string request_id = 1;
  string kind = 2;
  string repo_id = 3;
  string repo_slug = 4;
  string subject = 5;              // pseudonym / device id inside the signed body
  string subject_username = 6;     // relay-provided, display only
  string signer = 7;               // the signer named in the body (an owner key id `ok_…`)
  int64 issued_at_ms = 8;
  bool signed = 9;
  uint64 log_index = 10;           // once appended
  bytes body_to_sign = 11;         // the relay-proposed body (dry run), for the CLI to rebuild with the owner key
  // CONTRACT §19, from ApprovalRequest: display labels only (the CLI binds the decoded body and the
  // server's Lookup). ORG_CLAIMED: repo_id empty; ORG_REPO_*: repo_id = the project; DONOR_* of an
  // org: repo_id = org_id = the o_ id in the body.
  string org_id = 12;
  string org_path = 13;
  // CONTRACT §24, from ApprovalRequest: display labels (PERSON_*, DONOR_* of a person: the m_ id).
  string person_id = 14;
  string person_path = 15;
}

message SubmitEntryRequest {
  string request_id = 1;           // the pending request answered; empty for OWNER_KEY_ADDED
  string kind = 2;                 // REPO_CLAIMED, DONOR_APPROVED/REVOKED, MEMBER_ADDED/REMOVED, OWNER_KEY_ADDED, ORG_CLAIMED, ORG_REPO_ADDED/REMOVED
  bytes body = 3;                  // exact signed body (KEYLOG §2)
  repeated bytes sigs = 4;         // 64-byte Ed25519 signatures (owner key; rotation: new, previous)
}

message PendingRequest {}

message PendingResponse {
  repeated SignResponse requests = 1;
  // CONTRACT §19.2a: this owner's claims paused (or close to it), as the relay last pushed them.
  repeated ClaimState claims = 2;
}

// Link `ClaimStatus`, display only.
message ClaimState {
  string target_id = 1;            // "r_…" or "o_…"
  string path = 2;
  int64 verified_at_ms = 3;
  int64 paused_since_ms = 4;       // 0 = not paused (reminder window only)
  int64 releases_at_ms = 5;
}

message MembersRequest {
  string repo = 1;
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_ADD = 1;
    OP_REMOVE = 2;
  }
  Op op = 2;
  string user = 3;                 // username, pseudonym, or device id (with `device`)
  int64 cap_uusd_month = 4;        // 0 = repo default (relay-side setting, not signed)
  bool device = 5;                 // the subject is a device (CI / headless node)
  bool dry_run = 6;
}

message JournalRequest {
  bool follow = 1;
}

message JournalEntry {
  int64 t_ms = 1;
  string role = 2;                 // "gateway" | "worker"
  string task = 3;
  string repo = 4;
  string model = 5;
  string status = 6;               // ok | failed:<code> | cancelled | …
  int64 cost_uusd = 7;
  uint32 ms = 8;                   // duration
  bytes request = 9;               // only with `journal_full_text` (opt-in), bounded
  bytes response = 10;             // only with `journal_full_text` (opt-in), bounded
}

message McpOpen {
  string repo = 1;                 // owner/name ("" = detect from cwd)
  string cwd = 2;                  // shim working directory: fallback MCP `files` root
}

message McpUp {
  oneof msg {
    McpOpen open = 1;
    bytes data = 2;
  }
}

message McpDown {
  bytes data = 1;
}

message ShutdownRequest {}

message ShutdownResponse {}

message LogoutRequest {
  string reason = 1;               // [a-z0-9._-]{1,32}
}

message LogoutResponse {
  bool revoked = 1;                // the relay acknowledged the KEY_REVOKED request
  string detail = 2;
}

message ReportRequest {
  string task = 1;
  string reason = 2;
}

message ReportResponse {
  bytes bundle = 1;                // JSON evidence bundle
}

message DonationsRequest {
  string op = 1;                   // list | donate | action
  bytes request = 2;               // ListDonationsRequest | DonateRequest | DonationActionRequest
}

message DonationsResponse {
  bytes response = 1;              // ListDonationsResponse | Donation
}

message VerifyRequest {
  string receipt_ref = 1;
}

message VerifyResponse {
  string result_json = 1;          // {"verified","receipt_ref","donor","revoked","repo_id","model","cost_uusd","day","trust"}
}

message LinkCallRequest {
  string op = 1;
  bytes request = 2;
}

message LinkCallResponse {
  bytes response = 1;
}

message TrustOwnerKeyRequest {
  string owner_key_id = 1;         // ok_…
  bool dry_run = 2;                // only describe it
}

message TrustOwnerKeyResponse {
  string owner_key_id = 1;
  uint64 log_index = 2;            // its OWNER_KEY_ADDED entry
  bool revoked = 3;
  bool trusted = 4;                // acknowledged (false on a dry run)
}

message WatchRequest {}

message WatchEvent {
  int64 t_ms = 1;
  // snapshot: something changed (or events were coalesced): re-read the state.
  // served:   a request this device served (role worker) or a project of mine used (role gateway).
  // pending:  the requests waiting for my signature or my claims' state changed (re-read Pending).
  // donation: a donation's status changed (re-read Donations).
  // alert:    a key-log monitor alert (`detail` = the alert JSON, as Status.alerts).
  // link:     the relay link changed (`detail` = Status.link_state), or pause (`paused`) / resume.
  string kind = 2;
  JournalEntry served = 3;         // kind = served, without request/response bytes
  string detail = 4;
}
